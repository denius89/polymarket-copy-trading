name: Clean up merged task branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Do not check out or execute the merged PR's code. Use only event metadata.
      - name: Delete unchanged merged head with an explicit SHA lease
        env:
          CLEANUP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import base64, json, os, subprocess, tempfile
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event.get("pull_request", {})
          repo = os.environ["GITHUB_REPOSITORY"]
          head = pr.get("head", {})
          branch = head.get("ref", "")
          protected = {event["repository"]["default_branch"], pr.get("base", {}).get("ref"), "main", "master"}
          prefixes = ("docs/", "research/", "design/", "feat/", "fix/", "chore/", "maintenance/")
          if not pr.get("merged") or head.get("repo", {}).get("full_name") != repo or branch in protected or not branch.startswith(prefixes):
              print("No eligible completed task branch to delete.")
              raise SystemExit(0)
          sha = head["sha"]
          assert len(sha) == 40 and all(char in "0123456789abcdef" for char in sha)
          ref = "refs/heads/" + branch
          env = os.environ.copy()
          env["GIT_TERMINAL_PROMPT"] = "0"
          env["GIT_CONFIG_COUNT"] = "1"
          env["GIT_CONFIG_KEY_0"] = "http.https://github.com/.extraheader"
          env["GIT_CONFIG_VALUE_0"] = "AUTHORIZATION: basic " + base64.b64encode(("x-access-token:" + os.environ["CLEANUP_TOKEN"]).encode()).decode()
          for key in ["GIT_TRACE", "GIT_TRACE_CURL", "GIT_CURL_VERBOSE"]:
              env[key] = "0"
          url = "https://github.com/" + repo + ".git"
          remote = subprocess.check_output(["git", "ls-remote", "--heads", url, ref], env=env, text=True, timeout=30).strip()
          if not remote:
              outcome = "Task branch already absent."
          elif remote.split()[0] != sha:
              outcome = "Task branch advanced after review; preserved for separate inspection."
          else:
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run(["git", "init", "--bare", "--quiet", directory], check=True)
                  subprocess.run(["git", "--git-dir=" + directory, "push", "--force-with-lease=" + ref + ":" + sha, url, ":" + ref], env=env, check=True, timeout=90)
              outcome = "Merged task branch deleted with its exact reviewed SHA."
          print(outcome)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(outcome + "\n")
