name: shadow-v00
x-defaults: &defaults
  restart: "no"
  networks: [lab]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
services:
  db:
    <<: *defaults
    image: postgres:17.11-bookworm
    mem_limit: 1g
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?}
      POSTGRES_DB: shadow_v00
      V00_AUTH_PASSWORD: ${AUTH_DB_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-shadow-v00.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shadow_v00"]
      interval: 3s
      timeout: 2s
      retries: 20
  mail:
    <<: *defaults
    image: axllent/mailpit:v1.32.0
    mem_limit: 256m
    environment:
      MP_MAX_MESSAGES: "50"
  auth:
    <<: *defaults
    image: supabase/gotrue:v2.197.0
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    environment:
      API_EXTERNAL_URL: http://127.0.0.1:19999
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_SITE_URL: http://127.0.0.1:19999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://v00_auth:${AUTH_DB_PASSWORD:?}@db:5432/shadow_v00?sslmode=disable
      DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@shadow-v00.invalid
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
volumes:
  db-data:
networks:
  lab:
    internal: true
