<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive admin review</title>
<style>body{margin:0;background:#090c13;color:#eef0fa;font:14px system-ui}header{display:flex;gap:12px;align-items:center;padding:8px;height:44px}select{font:inherit;padding:8px}iframe{display:block;width:390px;height:calc(100vh - 60px);border:0;outline:1px solid #303546;max-width:none}</style>
<header><label for="review-width">Review width</label><select id="review-width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select><button id="review-full">Full page</button><button id="review-viewport">Viewport height</button><span>Same app, unchanged session</span></header>
<iframe src="index.html" title="Admin responsive viewport"></iframe>
<script>document.querySelector('select').addEventListener('change',e=>{document.querySelector('iframe').style.width=e.target.value+'px';document.querySelector('iframe').title='Admin viewport '+e.target.value+' px'});document.querySelector('#review-full').addEventListener('click',()=>{const f=document.querySelector('iframe');f.style.height=Math.max(f.contentDocument.documentElement.scrollHeight,f.contentDocument.body.scrollHeight)+'px'});document.querySelector('#review-viewport').addEventListener('click',()=>document.querySelector('iframe').style.height='calc(100vh - 60px)');</script></html>
