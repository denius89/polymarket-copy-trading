# Add inside the existing HTTPS server after adding the route and request
# method to the parent allowlists. Keep the parent checks for the other routes.
location ^~ /app/invite/ {
    auth_basic off;
    client_max_body_size 4k;
    proxy_pass http://demo_invite_private;
    proxy_set_header Host $http_host;
    proxy_set_header Connection close;
    proxy_set_header Authorization "";
    proxy_set_header X-Shadow-Edge-Participant "";
    include /run/paper-edge/demo-invite-credential.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    proxy_next_upstream off;
}
