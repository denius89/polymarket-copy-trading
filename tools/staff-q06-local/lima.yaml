minimumLimaVersion: 2.0.0
base:
- template:_images/ubuntu-24.04
vmType: vz
arch: aarch64
cpus: 3
memory: "4GiB"
disk: "18GiB"
mounts: []
containerd:
  system: false
  user: false
portForwards:
- guestPortRange: [1, 65535]
  ignore: true
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y -qq docker.io
